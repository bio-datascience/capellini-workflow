[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capellini-workflow"
version = "0.2.0"
description = "CAPELLINI Snakemake workflow: CRISPR-Abundance Phage-Evidence Linkage for Network Inference"
requires-python = ">=3.10"
dependencies = [
    "progenomes-harmonizer>=0.1.0",
    "biopython>=1.81",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "networkx>=3.1",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "snakemake>=8.0",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
capellini = "capellini_workflow.cli:main"

[project.optional-dependencies]
procs-maker = ["procs-maker>=0.1.0"]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["capellini_workflow*"]

[tool.setuptools.package-data]
capellini_workflow = ["data/references/**/*"]

# Workflow files are installed under <sys.prefix>/capellini_workflow/. Each
# subdirectory needs its own entry: a single "capellini_workflow" key flattens
# rules/ and scripts/ into one directory, which breaks the Snakefile's
# `include: "rules/*.smk"` and the CLI's scripts lookup.
# Only blank.yaml ships — config/*.yaml would sweep up local study configs
# (with absolute personal paths) into the wheel.
[tool.setuptools.data-files]
"capellini_workflow" = ["Snakefile"]
"capellini_workflow/rules" = ["rules/*.smk"]
"capellini_workflow/scripts" = ["scripts/*.py", "scripts/*.R"]
"capellini_workflow/config" = ["config/blank.yaml"]
